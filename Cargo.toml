[package]
name = "rsmatrix"
version = "0.1.0"
authors = ["github.com/vlwkaos"]
repository = "https://github.com/vlwkaos/rsmatrix"
edition = "2024"
readme = "README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.54", features = ["derive"] }
termion = "4.0.6"
rand = "0.9.2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
